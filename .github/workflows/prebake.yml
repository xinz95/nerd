name: Prebake current-season stats

on:
  schedule:
    # Every Sunday at 06:00 UTC
    - cron: '0 6 * * 0'
  workflow_dispatch: # allow manual trigger

jobs:
  prebake:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run prebake for current season
        run: python3 scripts/prebake-prior-year.py $(date +%Y)

      - name: Commit and push static data files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            YEAR=$(date +%Y)
            git commit -m "chore: prebake ${YEAR} season stats [skip ci]"
            git push
          fi
