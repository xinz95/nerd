<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NERD — Baseball Watchability</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="brand">
        <span class="brand-nerd">NERD</span>
        <span class="brand-sub">Baseball Watchability</span>
      </div>
      <nav class="date-nav">
        <button id="prev-day" aria-label="Previous day">&#8592;</button>
        <span id="date-display"></span>
        <button id="next-day" aria-label="Next day">&#8594;</button>
        <button id="refresh-btn" aria-label="Refresh data" title="Clear cache and reload latest stats">&#8635;</button>
      </nav>
    </div>
  </header>

  <div class="legend">
    <span class="legend-label">0</span>
    <div class="legend-bar"></div>
    <span class="legend-label">10</span>
    <span class="legend-hint">higher = more watchable</span>
  </div>

  <main id="main">
    <div id="loading" class="loading">Loading games&hellip;</div>
    <div id="error" class="error hidden"></div>
    <div id="no-games" class="no-games hidden">No games scheduled for this date.</div>
    <div id="cards" class="cards-grid"></div>
  </main>

  <footer>
    Data: <a href="https://statsapi.mlb.com" target="_blank" rel="noopener">MLB Stats API</a>
    &nbsp;&bull;&nbsp; Scores refresh every 5 min
    &nbsp;&bull;&nbsp; <a href="pitchers.html">Pitcher NERD List</a>
    &nbsp;&bull;&nbsp; <a href="teams.html">Team NERD List</a>
    &nbsp;&bull;&nbsp; <a href="methodology.html">Methodology</a>
  </footer>

  <script src="mlb.js?v=3"></script>
  <script src="nerd.js?v=3"></script>
  <script src="app.js?v=3"></script>
</body>
</html>
