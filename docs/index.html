<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NERD — Baseball Watchability</title>
  <script src="theme.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="brand">
        <span class="brand-nerd">NERD</span>
        <span class="brand-sub">Baseball Watchability</span>
      </div>
      <nav class="date-nav">
        <button id="prev-day" aria-label="Previous day">&#8592;</button>
        <span id="date-display"></span>
        <button id="next-day" aria-label="Next day">&#8594;</button>
        <button id="refresh-btn" aria-label="Refresh data" title="Clear cache and reload latest stats">&#8635;</button>
        <button id="theme-btn" class="theme-btn" aria-label="Toggle light/dark mode">☀</button>
      </nav>
    </div>
  </header>

  <nav class="tab-nav">
    <div class="tab-nav-inner">
      <a href="index.html" class="active">Today's Games</a>
      <a href="pitchers.html">Pitchers</a>
      <a href="teams.html">Teams</a>
      <a href="methodology.html">Methodology</a>
    </div>
  </nav>

  <div class="sort-bar">
    <span class="sort-label">Sort by</span>
    <div class="filter-tabs">
      <button class="filter-tab active" data-sort="nerd">NERD</button>
      <button class="filter-tab" data-sort="time">Game Time</button>
    </div>
  </div>


  <main id="main">
    <div id="loading" class="loading">Loading games&hellip;</div>
    <div id="error" class="error hidden"></div>
    <div id="no-games" class="no-games hidden">No games scheduled for this date.</div>
    <div id="cards" class="cards-grid"></div>
  </main>

  <footer>
    Data: <a href="https://statsapi.mlb.com" target="_blank" rel="noopener">MLB Stats API</a>
    &nbsp;&bull;&nbsp; Scores refresh every 5 min
  </footer>

  <script src="utils.js?v=1"></script>
  <script src="mlb.js?v=18"></script>
  <script src="nerd.js?v=10"></script>
  <script src="pnerd-loader.js?v=6"></script>
  <script src="app.js?v=23"></script>
</body>
</html>
